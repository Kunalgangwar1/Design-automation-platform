[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "design-automation-platform"
version = "0.1.0"
description = "Interview-preparation scaffold for a Solution Design Document automation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.8",
    "fastapi>=0.115",
    "google-genai>=1.0",
    "neo4j>=5.25",
    "numpy>=1.26",
    "openai>=2.0",
    "psycopg[binary]>=3.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.scripts]
inspect-chunks = "design_automation.ingestion.inspect:main"
inspect-retrieval = "design_automation.retrieval.inspect:main"

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires an explicitly enabled external service"]
